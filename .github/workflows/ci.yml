# EvoLab CI — real gates, replacing the former fake-green scaffold (lint+test
# could never fail, no build). Gates validated green at f784970 on
# 2026-10-08: lint (0 errors), type-check, vitest 60/60, build.
# This copy targets GitHub (ubuntu-latest hosted runners); the .forgejo/
# copy runs on the org Forgejo (docker runners). Keep both in sync
# gate-for-gate: lint, type-check, vitest, build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    if: github.repository == 'simongonzalezdc/EvoLab'
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
