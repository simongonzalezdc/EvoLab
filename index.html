<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EvoLab - Open source evolution simulator" />
    <title>EvoLab - Evolution Simulator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #0a0e27;
        color: #ffffff;
        overflow: hidden;
      }

      #app {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      #app canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 12px 15px;
        border-radius: 8px;
        border: 2px solid #4CAF50;
        font-size: 13px;
        font-family: 'Courier New', monospace;
        z-index: 100;
        min-width: 240px;
        max-width: 280px;
      }

      #hud h3 {
        margin: 0 0 10px 0;
        font-size: 16px;
        color: #4CAF50;
      }

      #hud .stat {
        display: flex;
        justify-content: space-between;
        margin: 4px 0;
        font-size: 12px;
      }

      #hud .stat-label {
        color: #aaa;
      }

      #hud .stat-value {
        font-weight: bold;
      }

      .bar-container {
        width: 100%;
        height: 10px;
        background: #333;
        border-radius: 5px;
        overflow: hidden;
        margin: 6px 0;
      }

      .bar {
        height: 100%;
        transition: width 0.3s ease;
        border-radius: 6px;
      }

      .bar-atp {
        background: linear-gradient(90deg, #FFD700, #FFA500);
      }

      .bar-health {
        background: linear-gradient(90deg, #4CAF50, #2E7D32);
      }

      #instructions {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 12px 15px;
        border-radius: 8px;
        border: 2px solid #4CAF50;
        font-size: 11px;
        z-index: 90;
        max-width: 260px;
      }

      #instructions h4 {
        margin: 0 0 6px 0;
        color: #4CAF50;
        font-size: 13px;
      }

      #instructions kbd {
        background: #333;
        padding: 1px 5px;
        border-radius: 3px;
        font-family: monospace;
        margin: 0 1px;
        font-size: 10px;
      }

      #instructions div {
        margin-bottom: 3px;
      }

      .reproduce-button {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: linear-gradient(135deg, #4CAF50, #2E7D32);
        border: 2px solid #4CAF50;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        animation: pulse 2s infinite;
      }

      .reproduce-button:hover {
        background: linear-gradient(135deg, #45a049, #1b5e20);
        transform: scale(1.05);
      }

      @keyframes pulse {
        0%, 100% {
          box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(76, 175, 80, 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <h3>🧬 EvoLab</h3>

        <div class="stat">
          <span class="stat-label" id="atp-label">ATP:</span>
          <span class="stat-value" id="atp-value">100</span>
        </div>
        <div class="bar-container">
          <div class="bar bar-atp" id="atp-bar" style="width: 100%"></div>
        </div>

        <div class="stat">
          <span class="stat-label" id="health-label">Health:</span>
          <span class="stat-value" id="health-value">100</span>
        </div>
        <div class="bar-container">
          <div class="bar bar-health" id="health-bar" style="width: 100%"></div>
        </div>

        <div class="stat">
          <span class="stat-label" id="glucose-label">Glucose:</span>
          <span class="stat-value" id="glucose-value">0</span>
        </div>

        <div class="stat">
          <span class="stat-label" id="aminoacid-label">Amino Acids:</span>
          <span class="stat-value" id="aminoacid-value">0</span>
        </div>

        <div class="stat">
          <span class="stat-label" id="phosphate-label">Phosphates:</span>
          <span class="stat-value" id="phosphate-value">0</span>
        </div>

        <div class="stat">
          <span class="stat-label">Generation:</span>
          <span class="stat-value" id="generation-value">1</span>
        </div>

        <div class="stat">
          <span class="stat-label">DNA Points:</span>
          <span class="stat-value" id="dna-value">0</span>
        </div>

        <button id="reproduce-btn" class="reproduce-button" style="display: none;">
          🧬 Reproduce!
        </button>
      </div>

      <div id="instructions">
        <h4>Controls</h4>
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> - Move cell</div>
        <div><kbd>Space</kbd> - Pause</div>
        <div>Collect yellow glucose particles to restore ATP!</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
